<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AoE2 Mini &mdash; Dark Age prototype</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22><rect width=%2216%22 height=%2216%22 rx=%223%22 fill=%22%2312141a%22/><rect x=%223.4%22 y=%223%22 width=%221.9%22 height=%223%22 fill=%22%23c8a558%22/><rect x=%227%22 y=%223%22 width=%221.9%22 height=%223%22 fill=%22%23c8a558%22/><rect x=%2210.6%22 y=%223%22 width=%221.9%22 height=%223%22 fill=%22%23c8a558%22/><rect x=%223.4%22 y=%225.6%22 width=%229.1%22 height=%221.4%22 fill=%22%238a6f34%22/><rect x=%224.4%22 y=%227%22 width=%227.1%22 height=%226%22 fill=%22%23c8a558%22/><rect x=%226.6%22 y=%229.2%22 width=%222.7%22 height=%223.8%22 rx=%221.35%22 fill=%22%2312141a%22/><rect x=%222.4%22 y=%2213%22 width=%2211.1%22 height=%221.3%22 rx=%220.65%22 fill=%22%238a6f34%22/></svg>">
<link rel="stylesheet" href="src/style.css">
</head>
<body>
<div id="app">
  <header>
    <div class="brand">AoE2&nbsp;MINI <small>dark age prototype</small></div>
    <div class="res" id="r_food"><span>food</span><b>0</b></div>
    <div class="res" id="r_wood"><span>wood</span><b>0</b></div>
    <div class="res" id="r_gold"><span>gold</span><b>0</b></div>
    <div class="res" id="r_stone"><span>stone</span><b>0</b></div>
    <div class="res" id="r_pop"><span>pop</span><b>0/0</b></div>
    <div class="res" id="r_age"><span>age</span><b>Dark Age</b></div>
    <button id="save" class="save" type="button">Save</button>
    <button id="mute" class="mute" type="button">Sound on</button>
  </header>

  <div id="stage">
    <canvas id="view"></canvas>
    <canvas id="minimap" width="168" height="168"></canvas>
    <div id="toast"></div>
    <div id="result"></div>
  </div>

  <footer id="hud" class="hud"></footer>
</div>

<!-- AoE2 Mini: a dependency-free browser RTS prototype (Dark Age slice).
     Controls: left click / tap / drag to select, right click / press-and-hold to command, WASD / arrows to pan.

     The game is plain classic scripts sharing one global scope, loaded in this order (no
     build step). tools/lib/load-game.js reads this list, so node runs exactly what the
     browser runs. docs/ARCHITECTURE.md says what lives in which file. -->
<script src="src/config.js"></script>
<script src="src/world.js"></script>
<script src="src/entities.js"></script>
<script src="src/sim.js"></script>
<script src="src/movement.js"></script>
<script src="src/economy.js"></script>
<script src="src/commands.js"></script>
<script src="src/ai.js"></script>
<script src="src/save.js"></script>
<script src="src/sound.js"></script>
<script src="src/render.js"></script>
<script src="src/hud.js"></script>
<script src="src/input.js"></script>
<script src="src/boot.js"></script>
<script src="src/main.js"></script>
</body>
</html>
